<svg viewBox="0 0 960 1180" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="960" height="1180" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Signal Digest — System Architecture</text>

  <!-- Frontend box -->
  <rect x="80" y="70" width="800" height="150" rx="10" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <text x="480" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Next.js Frontend</text>
  <g font-size="12.5" fill="#334155">
    <rect x="100" y="112" width="165" height="34" rx="6" fill="#eef2ff"/>
    <text x="182" y="133" text-anchor="middle">Dashboard / Digest</text>
    <rect x="277" y="112" width="150" height="34" rx="6" fill="#eef2ff"/>
    <text x="352" y="133" text-anchor="middle">Evidence Panel</text>
    <rect x="439" y="112" width="150" height="34" rx="6" fill="#eef2ff"/>
    <text x="514" y="133" text-anchor="middle">Freshness Banner</text>
    <rect x="601" y="112" width="180" height="34" rx="6" fill="#eef2ff"/>
    <text x="691" y="133" text-anchor="middle">Fault-Injection Control</text>

    <rect x="100" y="156" width="165" height="34" rx="6" fill="#eef2ff"/>
    <text x="182" y="177" text-anchor="middle">Watchlist Manager</text>
    <rect x="277" y="156" width="150" height="34" rx="6" fill="#eef2ff"/>
    <text x="352" y="177" text-anchor="middle">Historical Log</text>
    <rect x="439" y="156" width="150" height="34" rx="6" fill="#eef2ff"/>
    <text x="514" y="177" text-anchor="middle">About / Tour</text>
    <rect x="601" y="156" width="180" height="34" rx="6" fill="#eef2ff"/>
    <text x="691" y="177" text-anchor="middle">Today's Brief / Events</text>
  </g>

  <!-- Arrow down -->
  <line x1="480" y1="220" x2="480" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="245" font-size="12" fill="#64748b">HTTPS / JSON</text>

  <!-- Backend outer box -->
  <rect x="60" y="265" width="840" height="530" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="480" y="293" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">FastAPI Backend — single modular monolith</text>

  <!-- API layer -->
  <rect x="90" y="312" width="780" height="46" rx="6" fill="#ecfdf5"/>
  <text x="480" y="340" text-anchor="middle" font-size="13" fill="#334155">API Layer (routers) — demo-user identity seam · ownership-checked watchlist endpoints · DEMO_SECRET gate</text>

  <!-- Digest service -->
  <rect x="90" y="368" width="780" height="60" rx="6" fill="#ecfdf5"/>
  <text x="480" y="390" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Digest Service</text>
  <text x="480" y="410" text-anchor="middle" font-size="12" fill="#334155">ETag / ack (after-commit only) · Signal Evolution deltas · Event grouping · Today's Brief</text>

  <!-- Scoring engine -->
  <rect x="90" y="438" width="780" height="60" rx="6" fill="#ecfdf5"/>
  <text x="480" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Scoring Engine</text>
  <text x="480" y="480" text-anchor="middle" font-size="12" fill="#334155">z-score · volume ratio · sector tag · severity band · sample_size gate · look-ahead-safe rolling baselines</text>

  <!-- Provider abstraction -->
  <rect x="90" y="508" width="780" height="80" rx="6" fill="#ecfdf5"/>
  <text x="480" y="530" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Data Provider Abstraction</text>
  <rect x="110" y="540" width="270" height="34" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="245" y="561" text-anchor="middle" font-size="12" fill="#334155">HistoricalReplayProvider</text>
  <text x="480" y="561" text-anchor="middle" font-size="14" fill="#059669">→ decorated by</text>
  <rect x="580" y="540" width="270" height="34" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="715" y="561" text-anchor="middle" font-size="12" fill="#334155">FaultInjectingProvider</text>

  <!-- Scheduler + schema check -->
  <rect x="90" y="598" width="380" height="50" rx="6" fill="#ecfdf5"/>
  <text x="280" y="620" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Background Scheduler</text>
  <text x="280" y="638" text-anchor="middle" font-size="11" fill="#334155">APScheduler — one job, one interval</text>

  <rect x="490" y="598" width="380" height="50" rx="6" fill="#ecfdf5"/>
  <text x="680" y="620" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Startup Schema Check</text>
  <text x="680" y="638" text-anchor="middle" font-size="11" fill="#334155">verifies DB columns before scheduler starts</text>

  <!-- External: yfinance -->
  <rect x="90" y="668" width="230" height="50" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="205" y="690" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9a3412">yfinance (external)</text>
  <text x="205" y="707" text-anchor="middle" font-size="10.5" fill="#7c2d12">real historical OHLCV, no key</text>

  <rect x="340" y="668" width="270" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="475" y="690" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">LiveDelayedNSEProvider</text>
  <text x="475" y="707" text-anchor="middle" font-size="10.5" fill="#7f1d1d">optional · status-only · off by default</text>

  <rect x="630" y="668" width="240" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="750" y="690" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Groww Trading API</text>
  <text x="750" y="707" text-anchor="middle" font-size="10.5" fill="#64748b">real production path · not depended on</text>

  <!-- Backend internal arrows -->
  <line x1="480" y1="358" x2="480" y2="368" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="428" x2="480" y2="438" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="498" x2="480" y2="508" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="588" x2="280" y2="598" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="588" x2="680" y2="598" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow down to Postgres -->
  <line x1="480" y1="795" x2="480" y2="840" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Postgres -->
  <rect x="280" y="845" width="400" height="70" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="480" y="875" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">PostgreSQL</text>
  <text x="480" y="895" text-anchor="middle" font-size="11" fill="#64748b">tickers · price_ticks · baselines · flags · flag_ack · flag_ack_history · provider_state</text>

  <!-- Deployment footer -->
  <rect x="80" y="945" width="800" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="480" y="972" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Deployment</text>
  <text x="330" y="998" text-anchor="middle" font-size="12" fill="#334155">Vercel — Frontend</text>
  <text x="480" y="998" text-anchor="middle" font-size="12" fill="#334155">Render — FastAPI + Postgres</text>
  <text x="330" y="1018" text-anchor="middle" font-size="10.5" fill="#64748b">signal-digest-ruby.vercel.app</text>
  <text x="480" y="1018" text-anchor="middle" font-size="10.5" fill="#64748b">signal-digest.onrender.com</text>

  <!-- Legend -->
  <text x="80" y="1075" font-size="11" fill="#64748b">Green = internal service boundary</text>
  <text x="80" y="1092" font-size="11" fill="#64748b">Orange / red = external / optional data sources</text>
  <text x="80" y="1109" font-size="11" fill="#64748b">Purple = client-facing UI surface</text>
</svg>
